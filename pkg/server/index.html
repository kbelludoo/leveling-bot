<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Game Bot Control Panel</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #00d2ff;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-card .val { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    .acc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .acc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .acc-title { font-size: 1.1rem; font-weight: bold; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .badge-hunting { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-idle { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid #ffaa00; }
    .badge-error { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .bar-wrap { margin-bottom: 10px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
    .progress {
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-inner { height: 100%; transition: width 0.3s; }
    .hp-bar { background: linear-gradient(90deg, #ff3366, #ff6b8b); }
    .mana-bar { background: linear-gradient(90deg, #00d2ff, #0077ff); }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.85rem;
      background: #0d131f;
      padding: 10px;
      border-radius: 6px;
    }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: #1f2937;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #374151; }
    .btn-primary { background: #0284c7; border-color: #0284c7; }
    .btn-primary:hover { background: #0369a1; }
    .logs-box {
      margin-top: 14px;
      background: #000;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.72rem;
      max-height: 80px;
      overflow-y: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ GAME BOT DASHBOARD</h1>
    <span id="uptimeBadge" style="font-size: 0.85rem; color: var(--text-muted);">Uptime: ...</span>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="label">Contas Ativas</div>
      <div class="val" id="totalActive">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Ouro / Moedas</div>
      <div class="val" id="totalGold" style="color: #ffaa00;">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Inimigos Derrotados</div>
      <div class="val" id="totalKills" style="color: var(--accent-green);">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Memória RAM</div>
      <div class="val" id="ramStats" style="color: var(--accent);">0 MB</div>
    </div>
  </div>

  <div class="grid" id="accountsGrid"></div>

  <script>
    async function refresh() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        document.getElementById('uptimeBadge').textContent = 'Uptime: ' + data.uptime;
        document.getElementById('ramStats').textContent = data.ramAllocMB.toFixed(1) + ' MB (Sys: ' + data.ramSysMB.toFixed(1) + ' MB)';
        
        const accounts = data.accounts || [];
        let totalGold = 0;
        let totalKills = 0;
        let activeCount = 0;

        const grid = document.getElementById('accountsGrid');
        grid.innerHTML = '';

        accounts.forEach(acc => {
          totalGold += acc.gold || 0;
          totalKills += acc.kills || 0;
          if (acc.status === 'hunting') activeCount++;

          const hpPct = acc.maxHp > 0 ? Math.min(100, Math.round((acc.hp / acc.maxHp) * 100)) : 0;
          const manaPct = acc.maxMana > 0 ? Math.min(100, Math.round((acc.mana / acc.maxMana) * 100)) : 0;

          let badgeClass = 'badge-idle';
          if (acc.status === 'hunting') badgeClass = 'badge-hunting';
          if (acc.status.includes('error') || acc.status.includes('offline')) badgeClass = 'badge-error';

          const card = document.createElement('div');
          card.className = 'acc-card';
          card.innerHTML = `
            <div class="acc-header">
              <div>
                <span class="acc-title">${acc.name || acc.id}</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 6px;">Lv. ${acc.level || 1}</span>
              </div>
              <span class="badge ${badgeClass}">${acc.status}</span>
            </div>

            <div class="bar-wrap">
              <div class="bar-label"><span>Vida</span><span>${acc.hp}/${acc.maxHp} (${hpPct}%)</span></div>
              <div class="progress"><div class="progress-inner hp-bar" style="width: ${hpPct}%"></div></div>
            </div>

            <div class="bar-wrap">
              <div class="bar-label"><span>Mana / Recurso</span><span>${acc.mana}/${acc.maxMana} (${manaPct}%)</span></div>
              <div class="progress"><div class="progress-inner mana-bar" style="width: ${manaPct}%"></div></div>
            </div>

            <div class="info-grid">
              <div><strong>Ouro:</strong> ${(acc.gold || 0).toLocaleString()}</div>
              <div><strong>Kills:</strong> ${(acc.kills || 0).toLocaleString()}</div>
              <div><strong>Área:</strong> ${acc.currentArea || 'Nenhuma'}</div>
              <div><strong>EXP/h:</strong> ${Math.round(acc.expPerHour || 0).toLocaleString()}</div>
            </div>

            <div class="actions" style="flex-wrap: wrap;">
              <button class="btn btn-primary" onclick="dispatchAction('${acc.id}', 'autoHunt')">Toggle Hunt</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'equipBest')">Equip Best</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'allocateStats')">Distribuir Stats</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'repair')">Reparar</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'claimMissions')">Missões</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'shadowTeam')">Sombras</button>
            </div>

            <div class="logs-box">
              ${(acc.logs || []).slice(-4).map(l => '<div>▸ ' + l + '</div>').join('') || '<div>Nenhum log registrado</div>'}
            </div>
          `;
          grid.appendChild(card);
        });

        document.getElementById('totalActive').textContent = activeCount + '/' + accounts.length;
        document.getElementById('totalGold').textContent = totalGold.toLocaleString();
        document.getElementById('totalKills').textContent = totalKills.toLocaleString();

      } catch (e) {
        console.error('Falha ao atualizar dashboard:', e);
      }
    }

    async function dispatchAction(accId, action) {
      try {
        const res = await fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountId: accId, action: action })
        });
        const data = await res.json();
        alert(data.message || (data.ok ? 'Comando enviado!' : 'Erro: ' + data.error));
        refresh();
      } catch (e) {
        alert('Erro ao enviar ação: ' + e);
      }
    }

    setInterval(refresh, 2500);
    refresh();
  </script>
</body>
</html>
